<!doctype html>
<html lang="en" data-mood="evening">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06090f">
<meta name="description" content="Generative rain, thunder and lo-fi music for late-night study.">
<title>Rainroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<canvas id="bolt" aria-hidden="true"></canvas>
<canvas id="glass" aria-hidden="true"></canvas>

<div class="shell">
  <header class="top">
    <div class="brand"><em>Rainroom</em></div>
    <div class="strike" id="strike" aria-live="polite">
      <span class="strike-km" id="strikeKm"></span>
      <span class="strike-note" id="strikeNote"></span>
    </div>
  </header>

  <section class="hero" id="hero">
    <h1>Rain for the <em>late hours</em></h1>
    <p>Every drop, rumble and chord is generated live in your browser. Headphones help.</p>
    <button class="start" id="startBtn" type="button">Start the rain</button>
  </section>

  <section class="panel" id="panel" aria-label="Sound controls">
    <div class="panel-head">
      <button class="play" id="playBtn" type="button" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
      <div class="now">
        <div class="now-label" id="nowLabel">Steady rain</div>
        <div class="now-meta"><span id="nowMeta"></span><span class="focus-left" id="focusLeft"></span></div>
      </div>
      <button class="icon-btn" id="strikeBtn" type="button" aria-label="Call a lightning strike" title="Lightning (L)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 5 13.5h6L9.5 22 19 9.5h-6.2z"/></svg>
      </button>
      <button class="icon-btn" id="collapseBtn" type="button" aria-label="Hide controls" aria-expanded="true" title="Hide controls (H)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="panel-body">
      <div class="inner">
        <div class="tabs" role="tablist" aria-label="Control sections">
          <button class="tab" type="button" role="tab" id="tab-mix" data-tab="mix" aria-controls="pane-mix">Mix</button>
          <button class="tab" type="button" role="tab" id="tab-sounds" data-tab="sounds" aria-controls="pane-sounds">Sounds</button>
          <button class="tab" type="button" role="tab" id="tab-room" data-tab="room" aria-controls="pane-room">Room</button>
          <span class="tab-ink" aria-hidden="true"></span>
        </div>

        <div class="panes">
          <div class="pane" id="pane-mix" role="tabpanel" aria-labelledby="tab-mix">
            <div class="presets" role="group" aria-label="Presets">
              <button class="chip" type="button" data-preset="drizzle">Drizzle</button>
              <button class="chip" type="button" data-preset="steady">Steady rain</button>
              <button class="chip" type="button" data-preset="downpour">Downpour</button>
              <button class="chip" type="button" data-preset="storm">Thunderstorm</button>
              <button class="chip" type="button" data-preset="city">City night</button>
              <button class="chip" type="button" data-preset="focus">Lo-fi focus</button>
            </div>
            <div class="mixer">
              <label class="row" for="rain"><span class="lbl">Rainfall</span><input type="range" id="rain" min="0" max="100" step="1"><output id="rainOut"></output></label>
              <label class="row" for="rainVol"><span class="lbl">Rain vol</span><input type="range" id="rainVol" min="0" max="100" step="1"><output id="rainVolOut"></output></label>
              <label class="row" for="music"><span class="lbl">Music</span><input type="range" id="music" min="0" max="100" step="1"><output id="musicOut"></output></label>
              <label class="row" for="volume"><span class="lbl">Volume</span><input type="range" id="volume" min="0" max="100" step="1"><output id="volumeOut"></output></label>
            </div>
          </div>

          <div class="pane" id="pane-sounds" role="tabpanel" aria-labelledby="tab-sounds">
            <div class="tiles">
              <div class="tile" data-layer="thunder">
                <button class="tile-btn" type="button" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 5 13.5h6L9.5 22 19 9.5h-6.2z"/></svg>
                  <span class="tile-name">Thunder</span><span class="tile-state"></span>
                </button>
                <input type="range" id="lv-thunder" min="0" max="100" step="1" aria-label="Thunder level">
              </div>
              <div class="tile" data-layer="wind">
                <button class="tile-btn" type="button" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg>
                  <span class="tile-name">Wind</span><span class="tile-state"></span>
                </button>
                <input type="range" id="lv-wind" min="0" max="100" step="1" aria-label="Wind level">
              </div>
              <div class="tile" data-layer="window">
                <button class="tile-btn" type="button" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M12 3v18M4 12h16"/><path d="M8 6.5c.9 1.3 1.3 2 1.3 2.6a1.3 1.3 0 0 1-2.6 0c0-.6.4-1.3 1.3-2.6z"/></svg>
                  <span class="tile-name">Window</span><span class="tile-state"></span>
                </button>
                <input type="range" id="lv-window" min="0" max="100" step="1" aria-label="Rain on window level">
              </div>
              <div class="tile" data-layer="mud">
                <button class="tile-btn" type="button" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18c0-1.7 4-3 9-3s9 1.3 9 3-4 3-9 3-9-1.3-9-3z"/><path d="M12 3.5c2 3 3 4.5 3 6a3 3 0 0 1-6 0c0-1.5 1-3 3-6z"/></svg>
                  <span class="tile-name">Mud</span><span class="tile-state"></span>
                </button>
                <input type="range" id="lv-mud" min="0" max="100" step="1" aria-label="Mud and puddles level">
              </div>
              <div class="tile" data-layer="traffic">
                <button class="tile-btn" type="button" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 16v-4l2.2-5h10.6l2.2 5v4zM4.5 12h15"/><circle cx="8" cy="16.5" r="1.7"/><circle cx="16" cy="16.5" r="1.7"/></svg>
                  <span class="tile-name">Traffic</span><span class="tile-state"></span>
                </button>
                <input type="range" id="lv-traffic" min="0" max="100" step="1" aria-label="Traffic level">
              </div>
              <div class="tile" data-layer="keyboard">
                <button class="tile-btn" type="button" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7.5 14h9"/></svg>
                  <span class="tile-name">Keyboard</span><span class="tile-state"></span>
                </button>
                <input type="range" id="lv-keyboard" min="0" max="100" step="1" aria-label="Keyboard typing level">
              </div>
            </div>
          </div>

          <div class="pane" id="pane-room" role="tabpanel" aria-labelledby="tab-room">
            <div class="opt">
              <span class="lbl">Light</span>
              <div class="seg" role="radiogroup" aria-label="Time of day">
                <button type="button" role="radio" data-mood="day">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Daylight
                </button>
                <button type="button" role="radio" data-mood="evening">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Evening
                </button>
                <span class="seg-ink" aria-hidden="true"></span>
              </div>
            </div>
            <div class="opt">
              <span class="lbl">Lamps</span>
              <div class="lamps">
                <button class="lamp" type="button" data-lamp="desk" aria-pressed="false"><span class="bulb" aria-hidden="true"></span>Desk lamp</button>
                <button class="lamp" type="button" data-lamp="street" aria-pressed="false"><span class="bulb" aria-hidden="true"></span>Street lamps</button>
              </div>
            </div>
            <div class="opt">
              <span class="lbl">Focus</span>
              <div class="timer-chips" role="group" aria-label="Focus timer">
                <button class="chip small" type="button" data-min="0">Off</button>
                <button class="chip small" type="button" data-min="25">25m</button>
                <button class="chip small" type="button" data-min="50">50m</button>
                <button class="chip small" type="button" data-min="90">90m</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="vendor/three.min.js"></script>
<script src="js/audio.js"></script>
<script src="js/scene.js"></script>
<script src="js/app.js"></script>
</body>
</html>
